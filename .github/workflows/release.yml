# On version tags: verify the build, package the launcher .app, then cut a
# GitHub Release. Distribution of functionality is the repository itself
# (git installs via dsh plugin add); the .app is the standalone launcher
# entry point (see docs/adr/0003). No npm publishing, no code signing.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm package:mac
      - name: Zip the .app (ditto preserves permissions)
        run: ditto -c -k --keepParent release/mac-arm64/dsh-gui.app release/dsh-gui-mac-arm64.app.zip
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release/dsh-gui-mac-arm64.app.zip
